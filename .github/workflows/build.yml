name: Build APK dari zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak file zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Tidak ada file .zip di root repository"
            exit 1
          fi
          echo "Memakai: $ZIP"
          mkdir -p _proyek
          unzip -o -q "$ZIP" -d _proyek
          SETTINGS=$(find _proyek -maxdepth 3 -name 'settings.gradle*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan di dalam zip"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Folder proyek: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AIAgen-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
